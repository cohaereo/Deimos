[package]
name = "deimos"
version = "0.2.1"
edition = "2024"
default-run = "deimos"

[[bin]]
name = "deimos"
path = "src/main.rs"

[workspace]
members = [
    "crates/core",
    "crates/data",
    "crates/ecs",
    "crates/egui-sdl3-platform",
    "crates/render",
    "crates/dxil2spirv",
    "crates/umbra3",
    "crates/investment",
]

[workspace.dependencies]
ash = "0.38"
anyhow = "1"
bytemuck = "1.25"
crossbeam = "0.8"
egui = { version = "0.33", default-features = false, features = ["bytemuck"] }
egui_dock = "0.18"
glam = { version = "0.29", features = ["bytemuck", "fast-math", "serde"] }
itertools = "0.14"
hecs = "0.10.5"
parking_lot = "0.12"
profiling = "1"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
sdl3 = { version = "0.20", features = ["raw-window-handle"] }
tiger-parse = { version = "0.8.0", git = "https://github.com/v4nguard/tiger-parse.git", features = [
    "check_types",
    "check_types_strict",
    "tiger_pkg",
    "check_types_debug",
] }
tiger-pkg = { version = "0.21", features = ["global_manager_instance"] }
tracing = { version = "0.1" }

[dependencies]
deimos-core = { path = "./crates/core" }
deimos-data = { path = "./crates/data" }
deimos-ecs = { path = "./crates/ecs" }
deimos-render = { path = "./crates/render" }
egui-sdl3-platform = { path = "./crates/egui-sdl3-platform" }
umbra = { path = "./crates/umbra3" }

# (De)serialization
serde.workspace = true
tiger-parse.workspace = true
tiger-pkg.workspace = true
toml = "0.9.10"

# General
anyhow.workspace = true
bitflags = "2"
bytemuck = "1.22.0"
itertools.workspace = true
parking_lot.workspace = true
profiling.workspace = true
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "std",
    "tracing-log",
] }
tracing.workspace = true
tracy-client = { version = "0.18.4", optional = true }

# Graphics
ash.workspace = true
glam.workspace = true
sdl3.workspace = true

# UI
ahash = "0.8.12"
chroma-dbg = "0.2.1"
clap = { version = "4.5.37", features = ["derive"] }
egui.workspace = true
egui-ash-renderer = { version = "0.11.0", features = ["dynamic-rendering"] }
egui_dock.workspace = true
egui_extras = { version = "0.33", features = ["image", "svg"] }
google_material_symbols = "0.2.9"
hecs.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
native-dialog = "0.7.0"
nu-ansi-term = "0.50.1"
rayon.workspace = true

sysinfo = { version = "0.38.4", default-features = false, features = [
    "system",
] }
zip = "8.5.0"
ehttp = { version = "0.7.1", features = ["json"] }
semver = "1.0.28"
egui_commonmark = { version = "0.22.0", default-features = false }
regex = "1.12.3"
fastrand = "2.4.1"

[build-dependencies]
embed-resource = "3.0.1"

[profile.dev.package.tiger-pkg]
opt-level = 3

[profile.dev.package.deimos-data]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.quick]
inherits = "release"
debug = true
opt-level = 1
strip = "none"
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256

[features]
tracy = ["profiling/profile-with-tracy", "dep:tracy-client"]
